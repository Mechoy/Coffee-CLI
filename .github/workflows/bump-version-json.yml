name: Publish Mechoy version marker

# Fires when the maintainer clicks "Publish release" on a draft release
# (drafts are created by .github/workflows/release.yml after each tag push).
# That click is the final "ship to users" confirmation: writing
# Web-Home/mechoy-version.json makes the exact published version visible to
# the in-app updater and install scripts without using GitHub's rate-limited
# Releases API.
#
# Until the release is published, the marker stays on the previous version, so
# users cannot download an asset from a release still under review.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    if: startsWith(github.event.release.tag_name, 'mechoy-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Default GITHUB_TOKEN has contents:write from the job-level
          # permissions block above, which is enough to push a single-file
          # commit back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Mechoy version marker
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          VERSION="${TAG#mechoy-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a tag like mechoy-v3.3.6, got: $TAG"
            exit 1
          fi
          echo "{\"version\":\"$VERSION\"}" > Web-Home/mechoy-version.json

          if git diff --quiet Web-Home/mechoy-version.json; then
            echo "Mechoy version marker already at $VERSION — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web-Home/mechoy-version.json
          git commit -m "chore(web): publish Mechoy version marker $VERSION"
          git push origin main
