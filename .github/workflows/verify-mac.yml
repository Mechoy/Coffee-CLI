name: Verify macOS bundle

# Builds the final DMG from the current branch on a real Apple Silicon
# runner and checks that the packaged app signature is properly sealed.
# Used to verify codesigning fixes BEFORE tagging a release —
# avoids shipping a broken DMG to users.
#
# Pass criteria:
#   - codesign succeeds on the bundle
#   - "Sealed Resources" is NOT "none"
#   - spctl assessment doesn't report "code has no resources"
#
# Trigger: Actions → "Verify macOS bundle" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to build (default: current)'
        required: false
        default: ''

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Build frontend
        run: |
          cd src-ui
          npm ci
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: verify-mac

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build sealed DMG without hardened runtime
        run: |
          cargo tauri build --bundles dmg \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}' \
            --target aarch64-apple-darwin

      - name: Verify packaged app and launch smoke test
        run: |
          OUT="target/aarch64-apple-darwin/release/bundle"
          DMG=$(find "$OUT/dmg" -maxdepth 1 -type f -name "*.dmg" -print -quit)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced under $OUT/dmg"
            exit 1
          fi
          hdiutil verify "$DMG"

          MOUNT=$(mktemp -d)
          DEVICE=""
          cleanup() {
            if [ -n "$DEVICE" ]; then
              hdiutil detach "$DEVICE" || true
            fi
            rmdir "$MOUNT" 2>/dev/null || true
          }
          trap cleanup EXIT
          DEVICE=$(hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" | awk '/^\/dev\// { print $1; exit }')
          if [ -z "$DEVICE" ]; then
            echo "::error::Could not mount generated DMG"
            exit 1
          fi
          APP=$(find "$MOUNT" -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::No app found in generated DMG"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIG=$(codesign -dv --verbose=4 "$APP" 2>&1)
          printf '%s\n' "$SIG"
          if grep -qE 'flags=.*runtime' <<<"$SIG"; then
            echo "::error::Generated app still enables hardened runtime"
            exit 1
          fi
          if grep -q 'Sealed Resources=none' <<<"$SIG"; then
            echo "::error::Generated app has unsealed resources"
            exit 1
          fi

          # The binary runs from the actual packaged application, not the
          # intermediate app that Tauri removes after producing the DMG.
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)
          mkdir -p /tmp/logs
          (
            "$BIN" > /tmp/logs/stdout.log 2> /tmp/logs/stderr.log &
            PID=$!
            sleep 10
            if kill -0 $PID 2>/dev/null; then
              echo "OK: process stayed alive 10s"
              kill -TERM $PID || true
            else
              echo "::error::process died within 10s"
              cat /tmp/logs/stderr.log
              exit 1
            fi
          )
          echo "=== stderr (truncated) ==="
          head -50 /tmp/logs/stderr.log

      - name: Upload built DMG for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-cli-mac-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 3
