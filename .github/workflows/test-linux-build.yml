name: Test Linux Build (xterm 6.1.0-beta IME)

# THROWAWAY workflow — builds a Linux .deb/.AppImage from the xterm
# 6.1.0-beta test branch and uploads it as a downloadable artifact.
# This is NOT a release: no tag, no GitHub Release, no version.json bump,
# no user notification. Delete this file once the IME test concludes.
#
# Mirrors the Linux steps of release.yml (system deps, node, frontend,
# rust, tauri-cli, cargo tauri build) minus the release-upload stage.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/focused-jemison-d69eb1

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install & build frontend (with xterm 6.1.0-beta)
        run: |
          cd src-ui
          npm ci
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: linux-ime-beta-test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Linux bundles
        run: cargo tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-cli-linux-xterm-beta
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
